services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tree_editor
      POSTGRES_USER: tree
      POSTGRES_PASSWORD: tree
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tree -d tree_editor"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      ConnectionStrings__Tree: Host=db;Database=tree_editor;Username=tree;Password=tree;GSS Encryption Mode=Disable
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
